# =============================================================
#  hyprtab — Alt+Tab switcher + Super+Tab overview (Quickshell)
#  Paste into ~/.config/hypr/hyprland.conf, then `hyprctl reload`.
# =============================================================

# Start hyprtab at login (provides both views and IPC).
exec-once = qs -c hyprtab

# -------------------------------------------------------------
#  ALT-TAB SWITCHER (MRU)
# -------------------------------------------------------------
# Track Alt so its RELEASE commits the highlighted workspace.
bind = , Alt_L, global, hyprtab:mod
bind = , Alt_R, global, hyprtab:mod
# Cycle forward / backward while Alt is held.
bind = ALT,       Tab, global, hyprtab:next
bind = ALT SHIFT, Tab, global, hyprtab:prev
# Delete: close every window on the currently-highlighted workspace
# (mirrors the Windows Alt-Tab thumbnail Delete behavior, batched).
bind = ALT, Delete, global, hyprtab:closeAll
# Escape while alt-tab is up: cancel without committing the highlighted workspace
bind = ALT, escape, global, hyprtab:cancel

# -------------------------------------------------------------
#  OVERVIEW
#  Either keybind works; pick whichever you prefer.
# -------------------------------------------------------------
# Direct global shortcut (fastest path):
bind = SUPER, Tab, global, hyprtab:overviewToggle

# Or via IPC (equivalent; useful from scripts):
# bind = SUPER, Tab, exec, qs ipc -c hyprtab call overview toggle
# bind = SUPER SHIFT, Tab, exec, qs ipc -c hyprtab call overview open
# bind = SUPER CTRL,  Tab, exec, qs ipc -c hyprtab call overview close

# =============================================================
#  FALLBACK for the alt-tab binds if bare-Alt globals misbehave
#  on your build (some Hyprland versions are flaky here).
# =============================================================
# bind = ALT, Tab, global, hyprtab:next
# bind = ALT, Tab, submap, hyprtab
#
# submap = hyprtab
#     bind   = ALT,       Tab,    global, hyprtab:next
#     bind   = ALT SHIFT, Tab,    global, hyprtab:prev
#     bindrt = ALT, Alt_L, global, hyprtab:accept
#     bindrt = ALT, Alt_L, submap, reset
#     bindrt = ALT, Alt_R, global, hyprtab:accept
#     bindrt = ALT, Alt_R, submap, reset
#     bind   = , escape, global, hyprtab:cancel
#     bind   = , escape, submap, reset
# submap = reset
