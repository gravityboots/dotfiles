font_family GeistMono Nerd Font Mono
font_size   13

disable_ligatures no
enable_audio_bell no

shell             zsh
shell_integration enabled

cursor_shape                 block
# cursor_blink_interval        -1 linear
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 0

url_style curly

remember_window_size  yes
initial_window_width  640
initial_window_height 480
window_padding_width  24

background_opacity            0.90
scrollbar_handle_opacity      0.10
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0
confirm_os_window_close       0

sync_to_monitor no

# theme colors from https://github.com/dexpota/kitty-themes/tree/master/themes
# and from https://github.com/kovidgoyal/kitty-themes/blob/master/themes/tokyo_night_night.conf
# currently using 'glacier' theme from first
#
# Tokyo Night color scheme for kitty terminal emulator
# https://github.com/davidmathers/tokyo-night-kitty-theme
#
# Based on Tokyo Night color theme for Visual Studio Code
# https://github.com/enkia/tokyo-night-vscode-theme

foreground #a9b1d6
background #0a0b0f 
# #1a1b26

# Black
color0 #414868
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #73daca
color10 #73daca

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #c0caf5
color15 #c0caf5

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26

# Selection highlight
selection_foreground none
selection_background #28344a

# The color for highlighting URLs on mouse-over
url_color #9ece6a

# Window borders
active_border_color #3d59a1
inactive_border_color #101014
bell_border_color #e0af68

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #3d59a1
active_tab_background   #16161e
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #16161e
inactive_tab_font_style bold
tab_bar_background #101014

# Title bar
macos_titlebar_color #16161e

# Storm
# background #24283b
# cursor_text_color #24283b
# active_tab_background   #1f2335
# inactive_tab_background #1f2335
# macos_titlebar_color #1f2335

### NOTE: IF YOU USE kitten themes & apply modify kitty.conf it will comment all colors above and place some stuff below here ###
