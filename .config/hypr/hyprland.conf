# MONITOR


monitor = ,preferred,auto,1


# MAINMOD


$mainMod = SUPER


# STARTUP


exec-once = qs -c noctalia-shell
exec-once = qs -c overview
exec-once = ~/.local/bin/hypr-workspace-history.sh # pseudo alt-tab workspace switcher daemon
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = mpd-mpris


# ENVIRONMENT VARIABLES


env = QT_SCALE_FACTOR,1.2 # gsettings set org.gnome.desktop.interface text-scaling-factor 1.2 ; font: Adwaita Sans Regular 10px works best for most other apps
# env = GDK_DPI_SCALE,1.2 # basically mirrors the above, but not needed just use nwg-look and set text scale to 120%, and font size to 10px
env = HYPRSHOT_DIR,/home/gravityboots/Pictures/Screenshots
env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = WAYLAND_DISPLAY,wayland-1
env = VSCODE_GALLERY_SERVICE_URL,https://marketplace.visualstudio.com/_apis/public/gallery
env = VSCODE_GALLERY_ITEM_URL,https://marketplace.visualstudio.com/items
env = VSCODE_GALLERY_CACHE_URL,https://vscode.blob.core.windows.net/gallery/index
env = VSCODE_GALLERY_CONTROL_URL,
 

# APPEARANCE, DECORATION & ANIMATIONS


general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgb(c0caf5) # rgb(585b70)
    col.inactive_border = rgb(414868) # rgb(2a2b36)
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 8.0 # 2 - regular circle, higher - more squircle-ish curve

    active_opacity = 1
    inactive_opacity = 1

    dim_inactive = true
    dim_strength = 0.04

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee) # rgba(00000040)
        # offset = 0 6
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        special = true
        popups = true
        xray = false
    
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = bounce, 0.0, 1.25, 0.15, 1.0
    bezier = buttery, 0.1, 1.15, 0.15, 1.02
    bezier = smooth, 0.0, 0.0, 0.12, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windowsIn, 1, 4.5, bounce, slide
    animation = windowsOut, 1, 3.5, smooth, slide
    animation = windowsMove, 1, 4, buttery, slide

    animation = fadeIn, 1, 3.5, smooth
    animation = fadeOut, 1, 3, smooth
    animation = fadeDim, 1, 4, smooth
    animation = fadeShadow, 1, 4, smooth

    animation = workspaces, 1, 4.5, buttery, slidefade 10%    
    animation = specialWorkspace, 1, 4.5, buttery, slidefadevert -15%

    animation = border, 1, 7, smooth
    animation = borderangle, 1, 35, linear, loop

    animation = layersIn, 1, 4, bounce, slide
    animation = layersOut, 1, 3, smooth, slide
}


# INPUT RULES & MISCELLANEOUS


input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
	    tap-to-click = true
        scroll_factor = 0.75
    }

    scroll_factor = 0.5
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # vfr = true # added from performance section of hyprland wiki, removed due to error in hyprland 0.55.1
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

cursor {
    inactive_timeout = 3
}


# KEYBINDINGS


$ipc = qs -c noctalia-shell ipc call

# Apps
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, RETURN, exec, [float; size 1200 675] kitty
bind = $mainMod, E, exec, nautilus # originally thunar

# Core Noctalia binds
bind = SUPER, SUPER_L, exec, $ipc launcher toggle
bind = $mainMod, SPACE, exec, $ipc launcher toggle
bind = $mainMod, D, exec, $ipc controlCenter toggle
bind = $mainMod, I, exec, $ipc settings toggle
bind = $mainMod, V, exec, $ipc launcher clipboard
bind = $mainMod, PERIOD, exec, $ipc launcher emoji
bind = $mainMod, L, exec, $ipc lockScreen lock
bind = $mainMod, ESCAPE, exec, $ipc sessionMenu toggle
bind = $mainMod, W, exec, $ipc plugin:wallcards toggle
bind = $mainMod, SLASH, exec, $ipc plugin:keybind-cheatsheet toggle
bind = $mainMod, TAB, exec, qs ipc -c overview call overview toggle
# bind = $mainMod, P, exec, $ipc plugin:layout-mon toggle
# bind = $mainMod, P, exec, $ipc plugin:mirror toggle
# bind = $mainMod, N, exec, $ipc launcher notifications

# Utility Binds
bind = , PRINT, exec, hyprshot -m region -z --no-cursor
bind = SHIFT, PRINT, exec, hyprshot -m region --raw | swappy -f -
bind = $mainMod, PRINT, exec, hyprshot -m output
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m window
bind = $mainMod SHIFT, R, exec, $ipc plugin:screen-recorder toggle
bind = , XF86Launch2, exec, $ipc systemMonitor toggle
bind = , XF86Calculator, exec, [float; size 400 800; pin] gnome-calculator
bind = $mainMod SHIFT, G, exec, $ipc wallpaper set /home/gravityboots/Pictures/Wallpapers/ && notify-send "💦💦💦"
bind = CTRL ALT, DELETE, exec, $ipc wallpaper set /home/gravityboots/Pictures/Wallpapers/cooked.png && notify-send -u critical "FAHHHHH"

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bind = $mainMod, mouse_down, exec, $ipc volume increase
bind = $mainMod, mouse_up, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease
bindl = , XF86AudioPlay, exec, $ipc media playPause
bindl = , XF86AudioPause, exec, notify-send $ipc media playPause
bindl = , XF86AudioNext, exec, notify-send $ipc media next
bindl = , XF86AudioPrev, exec, notify-send $ipc media previous

# Hyprland Window Stuff
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, space, togglefloating
bind = $mainMod, F, fullscreen

bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

binde = $mainMod CTRL, Left, resizeactive, -20 0
binde = $mainMod CTRL, Right, resizeactive, 20 0
binde = $mainMod CTRL, Up, resizeactive, 0 -20
binde = $mainMod CTRL, Down, resizeactive, 0 20

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_up, workspace, e+1
# bind = $mainMod, mouse_down, workspace, e-1
bind = ALT, Tab, workspace, e+1
bind = ALT SHIFT, Tab, workspace, e-1
# bind = ALT, Tab, workspace, previous
# bind = ALT SHIFT, Tab, workspace, next

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Not sure what this does
# bind = $mainMod, P, pseudo
# bind = $mainMod, J, togglesplit


# WINDOW & LAYER RULES


# windowrule = match:class kitty, minsize 100 100

windowrule = match:class codium, opacity 0.90 0.90
windowrule = match:class ^(Spotify)$, opacity 0.85 0.85

windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.90 0.90

windowrule = match:class ^(org.gnome.Evince)$, float on
windowrule = match:class ^(org.gnome.Evince)$, center on
# windowrule = match:class ^(org.gnome.Evince)$, size 1600 900

windowrule = match:class ^(previewer)$, float on
windowrule = match:class ^(previewer)$, center on
# windowrule = match:class ^(previewer)$, size 1600 900

windowrule = match:class ^(org.gnome.Showtime)$, float on
windowrule = match:class ^(org.gnome.Showtime)$, center on
# windowrule = match:class ^(org.gnome.Showtime)$, size 1600 900

windowrule = match:class ^(org.gnome.Loupe)$, float on
windowrule = match:class ^(org.gnome.Loupe)$, center on
# windowrule = match:class ^(org.gnome.Loupe)$, size 1600 900

windowrule = match:class ^(org.gnome.Decibels)$, float on
windowrule = match:class ^(org.gnome.Decibels)$, center on
# windowrule = match:class ^(org.gnome.Decibels)$, size 800 400

windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, center on
windowrule = match:class ^(org.gnome.Calculator)$, size 400 800
windowrule = match:class ^(org.gnome.Calculator)$, opacity 1.0 0.5

windowrule = match:class mpv, float on
windowrule = match:class mpv, size 1600 900
windowrule = match:class mpv, center on
windowrule = match:class mpv, opacity 1.0 1.0

windowrule = match:float yes, center on

windowrule = match:class scratchterm, float on
windowrule = match:class scratchterm, size 85% 70%
windowrule = match:class scratchterm, center on

# windowrule = match:class ^(termius)$, 

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0
  blur = true
  blur_popups = true
}
layerrule = match:namespace noctalia-shell:regionSelector, no_anim on

layerrule = blur on, match:namespace quickshell:overview
layerrule = ignore_alpha 0, match:namespace quickshell:overview

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window

layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-notification-window

layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0, match:namespace quickshell

# FOR FIXING HYPRSHOT REGION SELECT SCREENSHOTS
layerrule = no_anim on, match:namespace selection
layerrule = no_anim on, match:namespace hyprpicker

